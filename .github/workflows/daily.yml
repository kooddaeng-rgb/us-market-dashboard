name: 미국 시장 일일 브리핑 자동 업데이트

on:
  schedule:
    # 매일 한국 시간 07:00 = UTC 22:00 (전날)
    - cron: '0 22 * * 0-4'   # 일~목 UTC 22:00 (월~금 KST 07:00)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests urllib3

      - name: 데이터 수집 및 HTML 생성
        run: python generate.py

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: main
          keep_files: true
          commit_message: "daily update: ${{ env.TODAY }}"

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "daily update $(date +'%Y-%m-%d' -d '+9 hours')"
          git push
