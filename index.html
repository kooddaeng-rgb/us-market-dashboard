<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; background: #f4f4f0; color: #1a1a1a; font-size: 15px; }

/* 헤더 */
.top-bar { background: #1a1a1a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.top-bar h1 { font-size: 15px; font-weight: 600; color: #fff; }
.top-updated { font-size: 11px; color: #888; }

/* 날짜 탭 */
.tab-bar {
  background: #fff; border-bottom: 1px solid #e4e4e0;
  display: flex; flex-direction: row;
  overflow-x: auto; position: sticky; top: 0; z-index: 20;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 11px 16px; font-size: 13px; border: none; background: none;
  cursor: pointer; color: #999; border-bottom: 3px solid transparent;
  white-space: nowrap; line-height: 1.3; flex-shrink: 0;
}
.tab-btn span { display: block; font-size: 10px; color: #bbb; margin-top: 1px; }
.tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }

/* 패널 */
.day-panel { display: none; max-width: 680px; margin: 0 auto; padding: 14px 14px 60px; }
.day-panel.visible { display: block; }

/* 타이틀 카드 */
.title-card {
  background: #fff; border-radius: 12px; border: 1px solid #e4e4e0;
  padding: 14px 16px; margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.title-card .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.title-card .left h2 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.title-card .left .meta { font-size: 12px; color: #888; line-height: 1.6; }
.status-pill { font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.status-sub { font-size: 11px; color: #888; text-align: right; flex-shrink: 0; margin-top: 3px; }

/* 지수 그리드 — 모바일 3열 고정 */
.idx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
@media (min-width: 500px) { .idx-grid { grid-template-columns: repeat(5, 1fr); } }
.idx-card { background: #fff; border: 1px solid #e4e4e0; border-radius: 10px; padding: 11px 12px; }
.idx-name { font-size: 11px; color: #999; margin-bottom: 4px; }
.idx-val { font-size: 15px; font-weight: 600; }
.idx-chg { font-size: 13px; font-weight: 600; margin-top: 3px; }
.up { color: #1a7a3c; } .dn { color: #b02020; }

.card { background: #fff; border: 1px solid #e4e4e0; border-radius: 12px; padding: 14px 16px; }
.card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #aaa; margin-bottom: 10px; }

/* 섹터 */
.sec-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f2f2ee; }
.sec-row:last-child { border-bottom: none; }
.sec-name { color: #444; flex: 1; font-size: 13px; padding-right: 8px; }
.bar-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.bar { height: 5px; border-radius: 3px; min-width: 2px; }
.bar-up { background: #1a7a3c; } .bar-dn { background: #b02020; }
.sec-pct { font-size: 13px; font-weight: 600; min-width: 55px; text-align: right; }

/* 주목 종목 */
.mover-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f2f2ee; }
.mover-row:last-child { border-bottom: none; }
.mover-t { font-size: 13px; font-weight: 600; }
.mover-n { font-size: 11px; color: #aaa; margin-top: 2px; }
.badge { font-size: 13px; font-weight: 600; padding: 3px 11px; border-radius: 10px; flex-shrink: 0; }
.badge-up { background: #e6f4ec; color: #1a7a3c; }
.badge-dn { background: #fceaea; color: #b02020; }

/* 환율 */
.fx-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f2f2ee; }
.fx-row:last-child { border-bottom: none; }
.fx-name { color: #555; font-size: 14px; }
.fx-val { font-weight: 600; font-size: 14px; }
.fx-chg { font-size: 13px; font-weight: 600; min-width: 65px; text-align: right; }

/* 뉴스 */
.news-row { display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid #f2f2ee; }
.news-row:last-child { border-bottom: none; }
.news-src { font-size: 10px; color: #bbb; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.news-txt { color: #333; font-size: 13px; line-height: 1.55; }

/* 테마 */
.theme-section { margin-bottom: 10px; }
.theme-section-title { font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 8px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.ts-bull  { background: #e6f4ec; color: #1a7a3c; }
.ts-mix   { background: #f5f5f0; color: #888; }
.ts-bear  { background: #fceaea; color: #b02020; }

.theme-left { flex: 1; min-width: 0; }
.theme-icon { font-size: 15px; margin-right: 5px; }
.theme-name { font-size: 14px; font-weight: 600; }
.theme-us { font-size: 12px; color: #888; margin-top: 3px; line-height: 1.55; }
.theme-kr { font-size: 12px; color: #aaa; margin-top: 2px; line-height: 1.5; }
.theme-right { flex-shrink: 0; text-align: right; }
.theme-pct { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.sig { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }

.sig-neutral{ background: #f2f2ee; color: #888; }

/* 인사이트 */

.divider { height: 1px; background: #f2f2ee; margin: 0 0 12px; }

const arrow = v => v >= 0 ? "▲" : "▼";
const cls   = v => v >= 0 ? "up" : "dn";
const sigLabel = s => ({hot:"강세",warm:"소폭 강세",neutral:"혼조",cold:"소폭 약세",freeze:"약세"}[s]||s);

function buildSectors(sectors) {
  const sorted = [...sectors].sort((a,b)=>b.chg-a.chg);
  const mx = Math.max(...sectors.map(s=>Math.abs(s.chg)));
  return sorted.map(s=>`
    <div class="sec-row">
      <span class="sec-name">${s.name}</span>
      <div class="bar-wrap">
        <div class="bar ${s.chg>=0?'bar-up':'bar-dn'}" style="width:${Math.round(Math.abs(s.chg)/mx*52)+3}px"></div>
        <span class="sec-pct ${cls(s.chg)}">${s.chg>=0?'+':''}${s.chg.toFixed(2)}%</span>
      </div>
    </div>`).join('');
}

function buildMovers(list, up) {
  return list.map(m=>`
    <div class="mover-row">
      <div>
        <div class="mover-t">${m.t}</div>
        <div class="mover-n">${m.n}</div>
        ${m.vol?`<div class="mover-vol">거래량 ${m.vol}</div>`:''}
      </div>
      <span class="badge ${up?'badge-up':'badge-dn'}">${up?'+':''}${m.chg.toFixed(2)}%</span>
    </div>`).join('');
}

function buildThemes(themes) {
  const bull = themes.filter(t=>t.sig==='hot'||t.sig==='warm');
  const mix  = themes.filter(t=>t.sig==='neutral');
  const bear = themes.filter(t=>t.sig==='cold'||t.sig==='freeze');

  const row = t=>`
    <div class="theme-row">
      <div class="theme-left">
        <div><span class="theme-icon">${t.icon}</span><span class="theme-name">${t.name}</span></div>
        <div class="theme-us">${t.us}</div>
        <div class="theme-kr">한국 주목: ${t.kr}</div>
        <div class="theme-kr" style="color:#888;margin-top:2px">→ ${t.note}</div>
      </div>
      <div class="theme-right">
        <div class="theme-pct ${cls(t.pct)}">${t.pct>=0?'+':''}${t.pct.toFixed(2)}%</div>
        <span class="sig sig-${t.sig}">${sigLabel(t.sig)}</span>
      </div>
    </div>`;

  let html='';
  if(bull.length){
    html+=`<div class="theme-section">
      <div class="theme-section-title ts-bull">▲ 강세 테마 — 매수 관심 (${bull.length}개)</div>
      <div class="card" style="padding:4px 16px 8px">${bull.map(row).join('')}</div>
    </div>`;
  }
  if(mix.length){
    html+=`<div class="theme-section">
      <div class="theme-section-title ts-mix">→ 혼조 테마 — 중립 관망 (${mix.length}개)</div>
      <div class="card" style="padding:4px 16px 8px">${mix.map(row).join('')}</div>
    </div>`;
  }
  if(bear.length){
    html+=`<div class="theme-section">
      <div class="theme-section-title ts-bear">▼ 약세 테마 — 주의·관망 (${bear.length}개)</div>
      <div class="card" style="padding:4px 16px 8px">${bear.map(row).join('')}</div>
    </div>`;
  }
  return html;
}

    'sig-cold':'#fff8ec','sig-freeze':'#fceaea'
  }[d.statusCls]||'#f2f2ee';
  const statusColor = {
    'sig-hot':'#1a7a3c','sig-warm':'#3a6d10','sig-neutral':'#888',
    'sig-cold':'#7a4a00','sig-freeze':'#b02020'
  }[d.statusCls]||'#888';

  return `
    <div class="title-card">
      <div class="top-row">
        <div class="left">
          <h2>📊 미국 시장 마감 브리핑</h2>

      </div>

          <div class="idx-chg ${cls(i.chg)}">${arrow(i.chg)} ${Math.abs(i.chg).toFixed(2)}%</div>

    </div>

    <div class="row2">
      <div class="card">
        <div class="card-title">섹터 흐름</div>
        ${buildSectors(d.sectors)}
      </div>
      <div>
        <div class="card" style="margin-bottom:10px">
          <div class="card-title">환율</div>
          ${d.fx.map(f=>`
            <div class="fx-row">
              <span class="fx-name">${f.name}</span>
              <span class="fx-val">${f.val}</span>
              <span class="fx-chg ${cls(f.chg)}">${arrow(f.chg)} ${Math.abs(f.chg).toFixed(2)}%</span>
            </div>`).join('')}
        </div>
        <div class="card">
          <div class="card-title">급등/급락 TOP3</div>
          ${d.gainers.slice(0,3).map(m=>`
            <div class="mover-row">
              <div><div class="mover-t">${m.t} <span style="font-weight:400;font-size:11px;color:#aaa">${m.n}</span></div></div>
              <span class="badge badge-up">+${m.chg.toFixed(1)}%</span>
            </div>`).join('')}
          ${d.losers.slice(0,3).map(m=>`
            <div class="mover-row">
              <div><div class="mover-t">${m.t} <span style="font-weight:400;font-size:11px;color:#aaa">${m.n}</span></div></div>
              <span class="badge badge-dn">${m.chg.toFixed(1)}%</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="card-title">주요 뉴스</div>
      ${d.news.map(n=>`
        <div class="news-row">
          <span class="news-src">${n.src}</span>
          <span class="news-txt">${n.txt}</span>
        </div>`).join('')}
    </div>

    <div class="insight">
      <div class="insight-label">오늘 한국장 핵심 포인트</div>
      ${d.insight.split(/(?<=\.) /).map(s=>`<div style="margin-bottom:5px">• ${s.trim()}</div>`).join('')}
    </div>

    <div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:500;color:#555;margin-bottom:8px;padding:0 2px">
        한국 시장 주목 테마 — 미국장 연동 분석 (${d.themes.length}개 테마)

const last = DAYS.length - 1;

// 패널은 정순으로 생성
DAYS.forEach((d, i) => {
  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i===last?' visible':'');
  panel.id = 'p'+d.id;
  panel.innerHTML = renderDay(d);
  panels.appendChild(panel);
});

// 탭은 역순(최신이 맨 왼쪽)으로 생성
[...DAYS].reverse().forEach((d, i) => {
  const isActive = i === 0; // 역순이므로 첫번째 = 최신
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (isActive?' active':'');
  btn.innerHTML = `${d.label}<span>${d.kor}</span>`;
  btn.onclick = () => {
    tabBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    panels.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('visible'));
    document.getElementById('p'+d.id).classList.add('visible');
    window.scrollTo(0,0);
  };
  tabBar.appendChild(btn);
});

document.getElementById('updatedAt').textContent = '업데이트: ' + UPDATED;
</script>
</body>
</html>
